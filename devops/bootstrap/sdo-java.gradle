/*
 * Interim bootstrap-only SDO phase. Run after the first Java compilation so
 * source DataObject interfaces can be inspected as compiled classes, and before
 * the final publish, which recompiles the newly generated mutable interfaces
 * and implementations into the SAME artifact.
 *
 * This is shared bootstrap behavior, not a product dependency or a per-repo
 * runner. Until build_source is available, the Algites SDO generator and naming
 * profile are fixed bootstrap tool dependencies.
 */

def bootstrapSdoManifest = rootProject.ext.bootstrapSdoManifest
def bootstrapSdoModule = { String suffix ->
    def matching = bootstrapSdoManifest.findAll { it.artifactId.endsWith(suffix) }
    if (matching.size() > 1) throw new GradleException("Ambiguous bootstrap SDO module: ${suffix}")
    return matching.isEmpty() ? null : project(':' + matching[0].project)
}

rootProject.repositories {
    def mode = System.getenv('MODUSTRO_BOOTSTRAP_DEPENDENCY_MODE') ?: 'remote'
    if (mode != 'remote') maven {
        url = uri(System.getenv('MODUSTRO_LOCAL_MAVEN_REPOSITORY') ?:
                new File(System.getenv('MODUSTRO_HOME') ?: new File(System.getProperty('user.home'), '.modustro').path,
                        'artifact-repos/java/maven'))
    }
    if (mode == 'remote') maven {
        url = uri(System.getenv('MODUSTRO_BOOTSTRAP_REMOTE_MAVEN_URL'))
        content {
            // SDO CLI is a bootstrap-only tool; its GroupId is declared by
            // the same detached dependency below, not by a repository regex.
            includeGroup('eu.algites.tool.codegen')
            rootProject.ext.bootstrapRemoteModustroGroups.each { includeGroup(it) }
        }
    }
    mavenCentral()
}

tasks.register('bootstrapSdoJava') {
    group = 'build'
    description = 'Generate SDO Java sources in their owning artifacts using the Algites build-source profile.'
    // Project runtimeClasspath contains the published runtime variant of
    // dependent Java projects.  In Gradle that can be a JAR, not merely the
    // classes directory.  The CLI's declared dependency on sdocodegen.intf
    // carries its packaged *.settings through that variant, and the selected
    // naming-profile JAR carries the Algites overlay.  Merely building
    // `classes` does not guarantee the JARs exist before we fork Java.
    dependsOn subprojects.collect { it.tasks.named('jar') }
    doLast {
        if (System.getenv('MODUSTRO_BOOTSTRAP_SDO_ABI_SEED') == '1') {
            def ids = bootstrapSdoManifest.collect { it.artifactId }.toSet()
            if (ids != ['pub.lib.General_naming.convention.intf'].toSet() ||
                    System.getenv('MODUSTRO_BOOTSTRAP_DEPENDENCY_MODE') != 'source') {
                throw new GradleException('Defs-only SDO ABI seed is permitted only for '
                        + 'the naming conventions source artifact')
            }
            logger.lifecycle('SDO Java: naming ABI seed; deferring SDO generation '
                    + 'until the source SDO Codegen CLI is built')
            return
        }
        def candidates = bootstrapSdoManifest.findAll { entry ->
            def folder = project(':' + entry.project).projectDir
            def roots = [new File(folder, 'src/product/java'), new File(folder, 'src/product/java.gen')]
            return roots.any { root -> root.isDirectory() && fileTree(root).matching {
                include '**/*.java'
            }.files.any { javaSource ->
                // This is only a cheap pre-filter: the SDO CLI verifies the
                // actual interface hierarchy and supported naming roles.
                // Checking for AIiDataObject as plain text is insufficient:
                // generators themselves contain that name in source templates.
                def body = javaSource.getText('UTF-8')
                (body =~ /(?m)^[ \t]*(?:(?:public|protected|private|static|abstract|sealed|non-sealed)[ \t]+)*interface[ \t]+[A-Za-z_][A-Za-z_0-9]*\b/).find()
            } }
        }
        if (candidates.isEmpty()) {
            logger.lifecycle('SDO Java: no Java sources; nothing generated.')
            return
        }
        def cliProject = bootstrapSdoModule('_generators.code.sdocodegen.cli')
        def profileProject = bootstrapSdoModule('_generators.code.profile.algites')
        def toolClasspath
        if (cliProject != null) {
            toolClasspath = files(cliProject.sourceSets.main.runtimeClasspath)
        } else {
            def dependency = dependencies.create('eu.algites.tool.codegen:pub.tool.General_generators.code.sdocodegen.cli:' +
                    (System.getenv('MODUSTRO_BOOTSTRAP_NATIVE_VERSION') ?: '1.1-SNAPSHOT'))
            toolClasspath = files(configurations.detachedConfiguration(dependency))
        }
        if (profileProject != null) {
            toolClasspath += files(profileProject.sourceSets.main.runtimeClasspath)
        } else {
            def dependency = dependencies.create('eu.algites.tool.codegen:pub.tool.General_generators.code.profile.algites:' +
                    (System.getenv('MODUSTRO_BOOTSTRAP_NATIVE_VERSION') ?: '1.1-SNAPSHOT'))
            toolClasspath += files(configurations.detachedConfiguration(dependency))
        }
        // Validate the actual resolved tool classpath, rather than hard-coding
        // the SDO source tree or copying resources into a bootstrap-only path.
        // The CLI must obtain these settings from its normal intf dependency
        // and from the Algites profile selected by this interim bootstrap.
        def classpathUrls = toolClasspath.files.findAll { it.exists() }
                .collect { it.toURI().toURL() }
        // Using an actual parent ClassLoader avoids Groovy's ambiguous
        // overload selection for URLClassLoader(URL[], null). The platform
        // loader keeps Gradle's own classes out of the validation lookup.
        def resourceLoader = new java.net.URLClassLoader(
                classpathUrls.toArray(new java.net.URL[0]),
                ClassLoader.getPlatformClassLoader())
        try {
            [
                'eu/algites/tool/codegen/sdo/sdocodegen-java-default.settings',
                'eu/algites/tool/codegen/sdo/sdocodegen-java.settings'
            ].each { resourceName ->
                if (resourceLoader.getResource(resourceName) == null) {
                    throw new GradleException('Missing SDO generator resource on resolved runtime classpath: '
                            + resourceName + '. Check the declared project dependencies '
                            + 'and ensure their JAR tasks completed. Classpath: '
                            + toolClasspath.asPath)
                }
            }
        } finally {
            resourceLoader.close()
        }
        def naming = [
                'standard-conventions.yml', 'algites-java-name-conventions.yml',
                'algites-python-name-conventions.yml', 'algites-jsondef-name-conventions.yml',
                'algites-yamldef-name-conventions.yml', 'algites-xmldef-name-conventions.yml',
                'algites-java-codegen-method-conventions.yml'
        ]
        def roles = [common: '', xmldefs_type: '-xml-type', xmldefs_element: '-xml-element',
                     yamldefs: '-yaml', jsondefs: '-json']
        def javaExecutable = new File(System.getProperty('java.home'), 'bin/java').absolutePath
        int count = 0
        candidates.each { entry ->
            def moduleProject = project(':' + entry.project)
            def output = new File(moduleProject.projectDir, 'src/product/java.gen')
            output.mkdirs()
            def classes = moduleProject.sourceSets.main.output.classesDirs.files.findAll { it.isDirectory() }
            if (classes.isEmpty()) throw new GradleException('Missing compiled Java DataObject classes for ' + entry.path)
            // The generator's transitive dependencies may contain a previously
            // published JAR of the artifact currently being bootstrapped. In
            // source mode that JAR is not authoritative: the compiled source
            // output is. In particular, mixing two releases of the same
            // standard-conventions.yml produces a misleading catalog conflict
            // (e.g. all_lower_1 with/without ConversionStyle).
            //
            // Substitute ONLY this artifact's compiled output for that same
            // artifact's published JAR. Do not globally ignore different
            // resources with the same name: genuine cross-artifact naming
            // conflicts must still fail in AIcNameConventionCatalog.loadAll.
            def sourceMode = (System.getenv('MODUSTRO_BOOTSTRAP_DEPENDENCY_MODE') == 'source')
            def ownPublishedJar = { File dependency ->
                sourceMode && dependency.name.endsWith('.jar') &&
                        dependency.name.startsWith(String.valueOf(entry.artifactId) + '-')
            }
            def toolFiles = toolClasspath.files.findAll { !ownPublishedJar(it) }
            def moduleFiles = moduleProject.sourceSets.main.runtimeClasspath.files
                    .findAll { !ownPublishedJar(it) }
            def ignoredOwnJars = (toolClasspath.files +
                    moduleProject.sourceSets.main.runtimeClasspath.files)
                    .findAll { ownPublishedJar(it) }
                    .collect { it.canonicalFile }
                    .unique()
            if (!ignoredOwnJars.isEmpty()) {
                logger.lifecycle('SDO Java: using source output of ' + entry.artifactId +
                        ' instead of published copies: ' + ignoredOwnJars)
            }
            // Make the source project's classes AND resources first on the
            // application classpath. Excluding the stale JAR without including
            // its freshly built replacement resources would lose the naming
            // standards and break source bootstrap.
            def binaryClasspath = files(moduleProject.sourceSets.main.output,
                    moduleFiles, toolFiles, classes)
            def classpath = binaryClasspath.asPath
            // Fail with the original classpath URLs if another library still
            // contributes an incompatible naming standard. Identical copies
            // are harmless, but an old published standard cannot be combined
            // with the source revision's ConversionStyle definitions.
            def standardResource = 'eu/algites/lib/naming/convention/standard-conventions.yml'
            def standardLoader = new java.net.URLClassLoader(
                    binaryClasspath.files.findAll { it.exists() }
                            .collect { it.toURI().toURL() }.toArray(new java.net.URL[0]),
                    ClassLoader.getPlatformClassLoader())
            try {
                def originsByHash = [:].withDefault { [] }
                def resources = standardLoader.getResources(standardResource)
                while (resources.hasMoreElements()) {
                    def url = resources.nextElement()
                    byte[] contents = url.openStream().withCloseable { it.readAllBytes() }
                    byte[] digest = java.security.MessageDigest.getInstance('SHA-256').digest(contents)
                    def hash = digest.encodeHex().toString()
                    originsByHash[hash] << url.toExternalForm()
                }
                if (originsByHash.size() > 1) {
                    throw new GradleException('Incompatible naming standards on Java SDO classpath for '
                            + entry.artifactId + ': ' + originsByHash + '\n'
                            + 'A stale published naming.convention.intf JAR may be shadowing '
                            + 'the current source module. Source mode must use one version.')
                }
            } finally {
                standardLoader.close()
            }
            // Discover actual read-only DataObject contracts from the compiled
            // artifact, not every Java interface in its source directories.
            // The previous coarse scan included AIiSmartDataObject itself:
            // it implements AIiDataObject but is a framework mutable marker,
            // not an input conforming to a versioned Defs naming convention.
            // Pass only selected classes to the CLI so that this bootstrap also
            // works with an older locally published SDO CLI (which may not yet
            // exclude mutable descendants during its own binary scan).
            def binaryUrls = binaryClasspath.files.findAll { it.exists() }
                    .collect { it.toURI().toURL() }
            def eligible = new LinkedHashSet<String>()
            def binaryLoader = new java.net.URLClassLoader(
                    binaryUrls.toArray(new java.net.URL[0]),
                    ClassLoader.getPlatformClassLoader())
            try {
                // Determine DataObject eligibility without loading the generator
                // implementation. Source prerequisites without read contracts must
                // remain buildable even when the locally published generator is old.
                // A module that has no DataObject API on its classpath cannot
                // declare DataObject contracts. Do not require the SDO engine.
                def loadOptional = { String name ->
                    try {
                        return Class.forName(name, false, binaryLoader)
                    } catch (ClassNotFoundException missing) {
                        return null
                    }
                }
                def readMarker = loadOptional('eu.algites.lib.data.dataobject.AIiDataObject')
                def mutableMarker = loadOptional('eu.algites.lib.data.smartdataobject.AIiSmartDataObject')
                def xmlNamespaceMarker = loadOptional('eu.algites.lib.data.dataobject.xmldefs.AIiXmlDataObjectNamespace')
                def dataObjectAnnotation = loadOptional('eu.algites.lib.data.dataobject.AIaDataObject')
                classes.each { directory ->
                    fileTree(directory).matching { include '**/*.class' }.files.each { compiled ->
                        def relative = directory.toPath().relativize(compiled.toPath()).toString()
                        if (relative.contains('$') || relative == 'module-info.class'
                                || relative.endsWith('/package-info.class')
                                || relative.endsWith('\\package-info.class')) return
                        def className = relative.replace(java.io.File.separatorChar, '.' as char)
                                .replaceAll(/\.class$/, '')
                        def candidate = Class.forName(className, false, binaryLoader)
                        if (candidate.isInterface()
                                && !candidate.packageName.startsWith('eu.algites.lib.data.dataobject')
                                && readMarker != null && readMarker.isAssignableFrom(candidate)
                                && (mutableMarker == null || !mutableMarker.isAssignableFrom(candidate))
                                && !(xmlNamespaceMarker != null
                                    && xmlNamespaceMarker.isAssignableFrom(candidate)
                                    && !candidate.declaredAnnotations.any {
                                        it.annotationType() == dataObjectAnnotation
                                    })) {
                            eligible.add(className)
                        }
                    }
                }
            } finally {
                binaryLoader.close()
            }
            if (eligible.isEmpty()) {
                logger.lifecycle('SDO Java: no eligible read-only DataObject contracts in '
                        + entry.path + '; skipping generator')
                return
            }
            // A generator revision is required only when this artifact really
            // needs SDO generation. Validate it before launching the CLI.
            def revisionLoader = new java.net.URLClassLoader(
                    binaryUrls.toArray(new java.net.URL[0]),
                    ClassLoader.getPlatformClassLoader())
            try {
                def service = Class.forName(
                        'eu.algites.tool.codegen.sdo.impl.standard.AIcSdoCodegenService',
                        false, revisionLoader)
                def origin = service.protectionDomain?.codeSource?.location
                logger.lifecycle('SDO Java: generator implementation ' + origin)
                def revision
                try {
                    revision = service.getField('KEYED_SDO_GENERATOR_REVISION').get(null)
                } catch (NoSuchFieldException obsolete) {
                    throw new GradleException('Outdated SDO generator binary at ' + origin
                            + ': missing indexed-collection revision. Rebuild and publish the '
                            + 'pub.tool.General SDO Codegen CLI/impl before source bootstrap.', obsolete)
                }
                if (revision != 'indexed-collection-delegation-20261031-1') {
                    throw new GradleException('Incompatible SDO generator revision ' + revision
                            + ' at ' + origin + '; require indexed-collection-delegation-20261031-1')
                }
            } finally {
                revisionLoader.close()
            }
            def arguments = [
                    '--repository-root=' + moduleProject.projectDir.absolutePath,
                    '--technology-dointf-input-dir:java=build/bootstrap-no-java-source-input',
                    '--technology-sdointf-output-dir:java=' + output.absolutePath,
                    '--technology-sdoimpl-output-dir:java=' + output.absolutePath,
                    '--sdointf-subpackage=impl.intf', '--sdoclass-subpackage=impl',
                    '--generated-dataobject-method-naming-convention:java=algites-java-codegen-standard_1'
            ]
            arguments << '--dointf-input-classes:java=' + eligible.join(';')
            arguments << '--dointf-classpath:java=' + classpath
            // Each catalogue needs a distinct qualified key. Keep the Gradle
            // script independent of Groovy eachWithIndex closure inference: it
            // is compiled during configuration even for bootstrap modules
            // without DataObject contracts.
            for (int locCatalogIndex = 0; locCatalogIndex < naming.size(); locCatalogIndex++) {
                // The complete argument must be one Groovy expression: a '+' at
                // the start of the next statement invokes String.positive().
                String catalogArgument = '--naming-conventions-file:catalog-' + locCatalogIndex + '=resource:' + naming[locCatalogIndex]
                arguments.add(catalogArgument)
            }
            roles.each { role, suffix ->
                arguments << "--input-technology-naming-convention:java:${role}:defsintf=algites-java-gen${suffix}-intf-versioned_1"
                arguments << "--output-technology-naming-convention:java:${role}:sdointf=algites-java-gen-data${suffix}-intf-versioned_1"
                arguments << "--output-technology-naming-convention:java:${role}:sdoclass=algites-java-gen-data${suffix}-class-versioned_1"
            }
            // Groovy interpolation yields GString values. ProcessBuilder expects
            // java.lang.String entries and otherwise fails converting its varargs
            // to String[] with "arraycopy: element type mismatch".
            List<String> command = ([javaExecutable, '-cp', classpath,
                    'eu.algites.tool.codegen.sdo.impl.cli.AIcSdoCodegenCli'] + arguments)
                    .collect { String.valueOf(it) }
            logger.lifecycle('SDO Java: scanning ' + entry.path)
            // Gradle runs inside a daemon. Child-process inheritIO() can write
            // straight to the daemon's file descriptors instead of the client
            // console, hiding the exception that actually caused Java to fail.
            // Consume both streams through Gradle and retain the output for
            // reproducible diagnostics without changing generator behavior.
            def diagnosticsRoot = new File(
                    System.getenv('MODUSTRO_BOOTSTRAP_NATIVE_OUTPUT') ?:
                            new File(rootProject.projectDir, 'build').absolutePath,
                    'sdo-java-diagnostics')
            if (!diagnosticsRoot.isDirectory() && !diagnosticsRoot.mkdirs())
                throw new GradleException('Cannot create SDO diagnostics directory: ' + diagnosticsRoot)
            def logFile = new File(diagnosticsRoot, entry.project + '.log')
            def process = new ProcessBuilder(command.toArray(new String[0]))
                    .directory(moduleProject.projectDir)
                    .redirectErrorStream(true)
                    .start()
            logFile.withWriter('UTF-8') { writer ->
                process.inputStream.withReader('UTF-8') { reader ->
                    reader.eachLine { line ->
                        writer.write(line)
                        writer.write('\n')
                        logger.lifecycle('SDO Java [' + entry.path + ']: ' + line)
                    }
                }
            }
            int exitCode = process.waitFor()
            if (exitCode != 0)
                throw new GradleException('Java SDO generator failed for ' + entry.path
                        + ' (exit code ' + exitCode + '; output: ' + logFile.absolutePath + ')')
            count++
        }
        logger.lifecycle("SDO Java: scanned ${count} artifacts; outputs stay in their existing java.gen roots")
    }
}
