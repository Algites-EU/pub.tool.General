$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json
Artifact:
  TechnologyKinds:
  - java
  - python
  Name: Shared DO and SDO code generation naming definitions
  Description: Shared configuration schemas and standard generated-method naming profiles.
Dependencies:
  - DependencyKind: java
    Items:
      - GroupId: org.testng
        ArtifactId: testng
        Usages: [develop_implementation]
        VersionRequirement: { Minimum: ">=7.0.0", Maximum: "<8.0.0", MaximumStrict: true }
  - DependencyKind: python
    Items:
      - ArtifactId: packaging
        Usages: [product_implementation]
        VersionRequirement:
          Minimum: ">=24.0"
          Maximum: "<27.0"
          MaximumStrict: true
