# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds: [java, python]
  Name: Defs Codegen core interfaces
  Description: Normalized canonical-definition model plus frontend/backend/codegen service contracts.

Dependencies:
  - DependencyKind: modustro
    Items:
      - GroupId: eu.algites.tool.codegen
        ArtifactId: pub.tool.General_generators.code.common
        Usages: [product_api]
        VersionRequirement: { Exact: "1.1-SNAPSHOT" }
      - GroupId: eu.algites.lib.common
        ArtifactId: pub.lib.General_common.util
        Usages: [product_api]
        VersionRequirement: { Exact: "1.1-SNAPSHOT" }
      # Interim single-artifact SDO outputs for the pre-Builder-1.1 bootstrap.
      # The generated AIigd*/AIcgd* classes currently reside alongside the
      # read-only contracts; they require the SmartDataObject runtime until
      # the agreed model.schema/do/sdo artifact split is available.
      - GroupId: eu.algites.lib.data
        ArtifactId: pub.lib.General_data.smartdataobject.impl.common
        Usages: [product_api]
        VersionRequirement: { Exact: "1.1-SNAPSHOT" }
      - GroupId: eu.algites.lib.naming
        ArtifactId: pub.lib.General_naming.convention.intf
        Usages: [product_api]
        VersionRequirement: { Exact: "1.1-SNAPSHOT" }
      # Legacy public Python request contracts expose AIcNameConventionCatalog.
      - GroupId: eu.algites.lib.naming
        ArtifactId: pub.lib.General_naming.convention.impl
        Usages: [product_api]
        VersionRequirement: { Exact: "1.1-SNAPSHOT" }
      - GroupId: eu.algites.lib.data
        ArtifactId: pub.lib.General_data.dataobject.intf
        Usages: [product_api]
        VersionRequirement: { Exact: "1.1-SNAPSHOT" }
