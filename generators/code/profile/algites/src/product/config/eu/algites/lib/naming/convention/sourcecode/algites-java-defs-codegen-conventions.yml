                Regexp: .+
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: Group
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
    - name: algites-java-string_enum_item_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: ''
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_snake_case_1
    - name: algites-java-non_string_enum_item_1
