# yaml-language-server: $schema=https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/codegen/defs/naming/defscodegen-naming-conventions_1.yamldef.schema.json
# New shared/specialized codegen naming profile. Legacy .old profiles are unchanged.
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/codegen/defs/naming/defscodegen-naming-conventions_1.yamldef.schema.json
NameCompositions:
  NameComposition:
    - name: algites-java-synthetic_property_type_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: variable
            Content:
              NameRegexp:
                Name: owner_type
                Regexp: .+
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: Property
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
    - name: algites-java-synthetic_inline_enum_type_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: variable
            Content:
              NameRegexp:
                Name: owner_type
                Regexp: .+
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
    - name: algites-java-synthetic_list_item_type_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: variable
            Content:
              NameRegexp:
                Name: owner_type
                Regexp: .+
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: Item
