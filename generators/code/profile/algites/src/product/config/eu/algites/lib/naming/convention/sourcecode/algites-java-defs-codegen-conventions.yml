DefsCodegenNameConventions:
  NameConventions:
    NameConvention:
      - name: algites-java-defscodegen-standard_1
        CommonNamingConvention: algites-java-codegen-common_1
        StructureNaming:
          Rule:
            - kind: synthetic_property_type
              Value: algites-java-synthetic_property_type_1
            - kind: synthetic_inline_enum_type
              Value: algites-java-synthetic_inline_enum_type_1
            - kind: synthetic_list_item_type
              Value: algites-java-synthetic_list_item_type_1
            - kind: synthetic_map_value_type
              Value: algites-java-synthetic_map_value_type_1
            - kind: synthetic_positional_item_type
              Value: algites-java-synthetic_positional_item_type_1
            - kind: synthetic_choice_variant_type
              Value: algites-java-synthetic_choice_variant_type_1
            - kind: synthetic_group_type
              Value: algites-java-synthetic_group_type_1
            - kind: string_enum_item
              Value: algites-java-string_enum_item_1
            - kind: non_string_enum_item
              Value: algites-java-non_string_enum_item_1
