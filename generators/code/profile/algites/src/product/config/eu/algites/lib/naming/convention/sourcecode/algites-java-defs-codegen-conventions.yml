    - name: algites-java-synthetic_positional_item_type_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: variable
            Content:
              NameRegexp:
                Name: owner_type
                Regexp: .+
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: Position
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
        - NameFragmentsSegmentValue:
            Kind: variable
            Content:
              NameRegexp:
                Name: position
                Regexp: '[0-9]+'
    - name: algites-java-synthetic_choice_variant_type_1
      Segments:
        - NameFragmentsSegmentValue:
