# yaml-language-server: $schema=https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/codegen/common/naming/data-object-naming-conventions_1.yamldef.schema.json
# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/codegen/common/naming/data-object-naming-conventions_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/codegen/common/naming/data-object-naming-conventions_1.yamldef.schema.json
NameCompositions:
  NameComposition:
    - name: algites-python-sdo-raw-getter_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: _getRaw_
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
    - name: algites-python-sdo-presence_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: _isPresent_
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
    - name: algites-python-sdo-unsetter_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: _unset_
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
    - name: algites-python-raw_empty_setter_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: _setEmpty_
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
    - name: algites-python-raw_empty_checker_method_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: _isEmpty_
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
GeneratedDataObjectMethodNameConventions:
  NameConventions:
    NameConvention:
      - name: algites-python-codegen-standard_1
        StructureNaming:
          Rule:
            - kind: standard_getter
              Value: python-getter-method-name_1
            - kind: standard_setter
              Value: python-setter-method-name_1
            - kind: raw_getter
              Value: algites-python-sdo-raw-getter_1
            - kind: raw_presence_checker_method
              Value: algites-python-sdo-presence_1
            - kind: raw_unsetter
              Value: algites-python-sdo-unsetter_1
            - kind: raw_empty_checker_method
              Value: algites-python-raw_empty_checker_method_1
            - kind: raw_empty_setter
              Value: algites-python-raw_empty_setter_1
            - kind: multi_mapped_list_key_synthetic_getter
              Value: _getKey
            - kind: multi_mapped_list_value_synthetic_getter
              Value: _getValue
        SchemaMetadataNaming:
          Rule:
            - kind: schema_source_schema_url
              Value: $id
            - kind: schema_source_schema_identifier
              Value: x-algites-schema-id
            - kind: schema_source_schema_version
              Value: x-algites-schema-version
            - kind: data_source_schema_url
              Value: $schema
            - kind: data_source_schema_identifier
              Value: ''
            - kind: data_source_schema_version
              Value: ''
