# yaml-language-server: $schema=https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/codegen/sdo/naming/sdocodegen-naming-conventions_1.yamldef.schema.json
# New shared/specialized codegen naming profile. Legacy .old profiles are unchanged.
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/codegen/sdo/naming/sdocodegen-naming-conventions_1.yamldef.schema.json
NameCompositions:
  NameComposition:
    - name: standardpostfix-java-raw_getter_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: _getRaw_
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
    - name: standardpostfix-java-raw_presence_checker_method_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: _isPresent_
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
    - name: standardpostfix-java-raw_unsetter_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: _unset_
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
    - name: standardpostfix-java-raw_empty_setter_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: _setEmpty_
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
    - name: standardpostfix-java-raw_empty_checker_method_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: _isEmpty_
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
SdoCodegenNameConventions:
  NameConventions:
    NameConvention:
      - name: standardpostfix-java-sdocodegen-standard_1
        CommonNamingConvention: standardpostfix-java-codegen-common_1
        StructureNaming:
          Rule:
            - kind: raw_getter
              Value: standardpostfix-java-raw_getter_1
            - kind: raw_presence_checker_method
              Value: standardpostfix-java-raw_presence_checker_method_1
            - kind: raw_unsetter
              Value: standardpostfix-java-raw_unsetter_1
            - kind: raw_empty_checker_method
              Value: standardpostfix-java-raw_empty_checker_method_1
            - kind: raw_empty_setter
              Value: standardpostfix-java-raw_empty_setter_1
