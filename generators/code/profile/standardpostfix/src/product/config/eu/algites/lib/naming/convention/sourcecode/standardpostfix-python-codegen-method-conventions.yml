# yaml-language-server: $schema=https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/codegen/common/naming/data-object-naming-conventions_1.yamldef.schema.json
# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/codegen/common/naming/data-object-naming-conventions_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/codegen/common/naming/data-object-naming-conventions_1.yamldef.schema.json
NameCompositions:
  standard-postfix-python-sdo-raw-getter_1:
    Segments:
    - NameFragmentsSegmentValue:
        Kind: constant_string
        Value: _getRaw_
    - NameFragmentsSegmentValue:
        Kind: identifier
        Convention: upper_camel_case_1
  standard-postfix-python-sdo-presence_1:
    Segments:
    - NameFragmentsSegmentValue:
        Kind: constant_string
        Value: _isPresent_
    - NameFragmentsSegmentValue:
        Kind: identifier
        Convention: upper_camel_case_1
  standard-postfix-python-sdo-unsetter_1:
    Segments:
    - NameFragmentsSegmentValue:
        Kind: constant_string
        Value: _unset_
    - NameFragmentsSegmentValue:
        Kind: identifier
        Convention: upper_camel_case_1
GeneratedDataObjectMethodNameConventions:
  NameConventions:
    standard-postfix-python-codegen-standard_1:
      StructureNaming:
        standard_getter: python-getter-method-name_1
        standard_setter: python-setter-method-name_1
        raw_getter: standard-postfix-python-sdo-raw-getter_1
        raw_presence_checker_method: standard-postfix-python-sdo-presence_1
        raw_unsetter: standard-postfix-python-sdo-unsetter_1
        # Literal synthetic getter name for JSON/YAML object-keyed values.
        multi_mapped_list_key_synthetic_getter: _getKey
        multi_mapped_list_value_synthetic_getter: _getValue
      SchemaMetadataNaming:
        # Schema declaration field containing the schema URI; blank disables URL extraction.
        schema_source_schema_url: $id
        # Schema declaration field containing the stable logical schema ID; blank disables ID extraction.
        schema_source_schema_identifier: x-algites-schema-id
        # Schema declaration field containing the logical schema version; blank disables version extraction.
        schema_source_schema_version: x-algites-schema-version
        # Instance document field used to write/read the source schema URI; blank disables. Requires schema_source_schema_url.
        data_source_schema_url: $schema
        # Instance document field used to write/read the source schema ID; blank disables. Requires schema_source_schema_identifier.
        data_source_schema_identifier: ''
        # Instance document field used to write/read the source schema version; blank disables. Requires schema_source_schema_version.
        data_source_schema_version: ''
