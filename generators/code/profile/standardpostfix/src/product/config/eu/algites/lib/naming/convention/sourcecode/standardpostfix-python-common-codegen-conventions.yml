# yaml-language-server: $schema=https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/codegen/common/naming/codegen-common-naming-conventions_1.yamldef.schema.json
# New shared/specialized codegen naming profile. Legacy .old profiles are unchanged.
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/codegen/common/naming/codegen-common-naming-conventions_1.yamldef.schema.json
NameCompositions:
  NameComposition:
    - name: standardpostfix-python-list-getter_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: get
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: List
    - name: standardpostfix-python-positional-getter_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: getItem
        - NameFragmentsSegmentValue:
            Kind: variable
            Content:
              NameRegexp:
                Name: position
                Regexp: '[0-9]+'
    - name: standardpostfix-python-const_container_interface_1
      Segments:
        - NameFragmentsSegmentValue:
            Kind: constant_string
            Content:
              Value: CONST
        - NameFragmentsSegmentValue:
            Kind: identifier
            Content:
              Convention: upper_camel_case_1
CommonCodegenNameConventions:
  NameConventions:
    NameConvention:
      - name: standardpostfix-python-codegen-common_1
        StructureNaming:
          Rule:
            - kind: standard_getter
              Value: python-getter-method-name_1
            - kind: list_getter
              Value: standardpostfix-python-list-getter_1
            - kind: standard_setter
              Value: python-setter-method-name_1
            - kind: multi_mapped_list_key_synthetic_getter
              Value: _getKey
            - kind: multi_mapped_list_value_synthetic_getter
              Value: _getValue
            - kind: positional_item_synthetic_getter
              Value: standardpostfix-python-positional-getter_1
            - kind: const_container_interface
              Value: standardpostfix-python-const_container_interface_1
        SchemaMetadataNaming:
          Rule:
            - kind: schema_source_schema_url
              Value: $id
            - kind: schema_source_schema_identifier
              Value: x-algites-schema-id
            - kind: schema_source_schema_version
              Value: x-algites-schema-version
            - kind: data_source_schema_url
              Value: $schema
            - kind: data_source_schema_identifier
              Value: ''
            - kind: data_source_schema_version
              Value: ''
        IndexesStartingFrom: 1
