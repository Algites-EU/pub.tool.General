# yaml-language-server: $schema=https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/codegen/sdo/naming/sdocodegen-naming-conventions_1.yamldef.schema.json
# New shared/specialized codegen naming profile. Legacy .old profiles are unchanged.
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/codegen/sdo/naming/sdocodegen-naming-conventions_1.yamldef.schema.json
NameCompositions:
  standardpostfix-python-raw_getter_1:
    Segments:
    - NameFragmentsSegmentValue:
        Kind: constant_string
        Value: _getRaw_
    - NameFragmentsSegmentValue:
        Kind: identifier
        Convention: upper_camel_case_1
  standardpostfix-python-raw_presence_checker_method_1:
    Segments:
    - NameFragmentsSegmentValue:
        Kind: constant_string
        Value: _isPresent_
    - NameFragmentsSegmentValue:
        Kind: identifier
        Convention: upper_camel_case_1
  standardpostfix-python-raw_unsetter_1:
    Segments:
    - NameFragmentsSegmentValue:
        Kind: constant_string
        Value: _unset_
    - NameFragmentsSegmentValue:
        Kind: identifier
        Convention: upper_camel_case_1
SdoCodegenNameConventions:
  NameConventions:
    standardpostfix-python-sdocodegen-standard_1:
      CommonNamingConvention: standardpostfix-python-codegen-common_1
      StructureNaming:
        raw_getter: standardpostfix-python-raw_getter_1
        raw_presence_checker_method: standardpostfix-python-raw_presence_checker_method_1
        raw_unsetter: standardpostfix-python-raw_unsetter_1
