# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json
Artifact:
  TechnologyKinds: [java, python]
  Name: SmartDataObject code generator API
  Description: Schema-independent Java and Python generation contracts.
Dependencies:
  - DependencyKind: modustro
    Items:
      - GroupId: eu.algites.tool.codegen
        ArtifactId: pub.tool.General_generators.code.common
        Usages: [product_api]
        VersionRequirement: { Exact: "1.1-SNAPSHOT" }
      # Generated common/formatted naming contracts expose shared collection and parent types.
      - GroupId: eu.algites.lib.common
        ArtifactId: pub.lib.General_common.util
        Usages: [product_api]
        VersionRequirement: { Exact: "1.1-SNAPSHOT" }
      - GroupId: eu.algites.lib.naming
        ArtifactId: pub.lib.General_naming.convention.intf
        Usages: [product_api]
        VersionRequirement: { Exact: "1.1-SNAPSHOT" }
      - GroupId: eu.algites.lib.data
        ArtifactId: pub.lib.General_data.dataobject.intf
        Usages: [product_api]
        VersionRequirement: { Exact: "1.1-SNAPSHOT" }
      # Generated mutable SDO interfaces and implementations live in this
      # owning API artifact and extend the new common SDO runtime.
      - GroupId: eu.algites.lib.data
        ArtifactId: pub.lib.General_data.smartdataobject.impl.common
        Usages: [product_api]
        VersionRequirement: { Exact: "1.1-SNAPSHOT" }
