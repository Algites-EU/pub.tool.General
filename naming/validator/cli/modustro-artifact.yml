$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds: [java, python]
  Name: Naming validator CLI
  Description: Command-line adapter for the reusable naming validation engine.

Dependencies:
  - DependencyKind: modustro
    Items:
      # This CLI consumes the profile-neutral naming catalog implementation.
      # The actual naming profile is supplied by the caller as a YAML file.
      - GroupId: eu.algites.lib.naming
        ArtifactId: pub.lib.General_naming.convention.impl
        Usages: [product_implementation]
        VersionRequirement: { Exact: "1.1-SNAPSHOT" }
